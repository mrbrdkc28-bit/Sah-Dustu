<svg viewBox="0 0 400 240" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <defs>
    <radialGradient id="acrIsik">
      <stop offset="0" stop-color="#F2B85A" stop-opacity=".36"/>
      <stop offset=".45" stop-color="#C8862E" stop-opacity=".12"/>
      <stop offset="1" stop-color="#C8862E" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="acrKoni" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFD58A" stop-opacity=".32"/>
      <stop offset="1" stop-color="#FFD58A" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="acrZemin" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E8B64C" stop-opacity="0"/>
      <stop offset=".5" stop-color="#E8B64C" stop-opacity=".5"/>
      <stop offset="1" stop-color="#E8B64C" stop-opacity="0"/>
    </linearGradient>
    <!-- Kenar ışığı: siluetin dış hattı (parçalar tek gövde gibi birleşir, iç dikiş görünmez) -->
    <filter id="acrKenar" x="-10%" y="-10%" width="120%" height="120%">
      <feMorphology in="SourceAlpha" operator="dilate" radius="1.3" result="d"/>
      <feFlood flood-color="#E8B64C" flood-opacity=".75"/>
      <feComposite in2="d" operator="in" result="k"/>
      <feMerge><feMergeNode in="k"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- IŞIKLI KATMAN: lamba yanınca görünür (açılışta class="acrIsikli" canlandırılır) -->
  <g class="acrIsikli">
  <!-- sıcak lamba ışığı -->
  <ellipse cx="200" cy="130" rx="196" ry="106" fill="url(#acrIsik)"/>
  <path d="M177 38 L223 38 L284 158 L116 158 Z" fill="url(#acrKoni)"/>
  <ellipse cx="200" cy="39.5" rx="9" ry="2.4" fill="#FFE2A8" opacity=".95"/>
  <rect x="30" y="222" width="340" height="1.4" fill="url(#acrZemin)"/>

  <!-- BABA (solda, tahtaya eğilmiş, elinde taş) -->
  <g filter="url(#acrKenar)" fill="#07080d" stroke="#07080d" stroke-linecap="round" stroke-linejoin="round">
    <!-- sandalye -->
    <path stroke="none" d="M68 98 h6 v124 h-6 Z M68 162 h70 v6 h-70 Z M130 168 h6 v54 h-6 Z"/>
    <!-- bacaklar -->
    <path fill="none" stroke-width="13" d="M104 160 L158 164 L157 213"/>
    <path fill="none" stroke-width="7" d="M156 216 L174 217"/>
    <!-- gövde -->
    <path stroke="none" d="M117 92 C103 96 92 114 91 136 L94 162 L142 162 C145 147 146 125 141 110 C138 101 131 95 124 93 Z"/>
    <!-- boyun + baş + saç -->
    <path stroke="none" d="M119 84 h9 v12 h-9 Z"/>
    <circle cx="127" cy="77" r="12"/>
    <path stroke="none" d="M115 74 C116 63 130 60 137 68 C132 66 124 66 118 72 Z"/>
    <!-- uzanan kol: omuz → dirsek → el (taşı kaldırıyor) -->
    <path fill="none" stroke-width="10" d="M133 104 L149 126 L170 131"/>
    <circle cx="172" cy="130" r="4.5"/>
    <!-- arkadaki kol, masada -->
    <path fill="none" stroke-width="8" d="M118 110 L132 140 L152 146"/>
  </g>
  <!-- elde kaldırılan taş (piyon) -->
  <path d="M174 124 h7 l-1.4-2 v-4.5 a2.6 2.6 0 1 0 -2.8 0 v4.5 Z" fill="#07080d" stroke="#FFD58A" stroke-opacity=".9" stroke-width="1"/>

  <!-- ÇOCUK (sağda, minderin üstünde, eli çenesinde düşünüyor) -->
  <g filter="url(#acrKenar)" fill="#07080d" stroke="#07080d" stroke-linecap="round" stroke-linejoin="round">
    <path stroke="none" d="M324 116 h6 v106 h-6 Z M266 170 h64 v6 h-64 Z M266 176 h6 v46 h-6 Z"/>
    <path stroke="none" d="M271 162 h52 a3 3 0 0 1 3 3 v5 h-58 v-5 a3 3 0 0 1 3 -3 Z"/>
    <!-- sarkan bacaklar -->
    <path fill="none" stroke-width="10" d="M300 160 L263 165 L263 199"/>
    <path fill="none" stroke-width="6" d="M262 202 L251 203"/>
    <!-- gövde -->
    <path stroke="none" d="M288 118 C299 120 307 132 307 148 L305 163 L271 163 C269 150 270 136 275 127 C278 121 283 118 288 118 Z"/>
    <!-- boyun + baş + saç perçemi -->
    <path stroke="none" d="M280 110 h7 v10 h-7 Z"/>
    <circle cx="283" cy="104" r="10"/>
    <path stroke="none" d="M276 97 C279 89 291 90 294 98 C290 95 285 95 281 99 Z"/>
    <!-- kol: dirsek masada, el çenede -->
    <path fill="none" stroke-width="7" d="M281 128 L259 148 L274 114"/>
    <!-- öbür kol, masada -->
    <path fill="none" stroke-width="6.5" d="M292 128 L284 144 L260 151"/>
  </g>

  <!-- MASA + TAHTA -->
  <g filter="url(#acrKenar)" fill="#07080d">
    <path d="M148 150 H252 a2 2 0 0 1 2 2 v4 a2 2 0 0 1 -2 2 H148 a2 2 0 0 1 -2 -2 v-4 a2 2 0 0 1 2 -2 Z"/>
    <path d="M196 158 h8 v56 h-8 Z"/>
    <ellipse cx="200" cy="217" rx="30" ry="5"/>
    <path d="M160 150 L240 150 L232 140 L168 140 Z"/>
  </g>
  <!-- tahtanın kareleri (ışıkta) -->
  <g fill="#E8B64C" fill-opacity=".6">
    <path d="M168 140 h8 l-1 2.5 h-8 Z M184 140 h8 l-.5 2.5 h-8 Z M200 140 h8 l0 2.5 h-8 Z M216 140 h8 l.5 2.5 h-8 Z"/>
    <path d="M175 142.5 h8 l-1 2.5 h-8 Z M191 142.5 h8 l-.5 2.5 h-8 Z M207 142.5 h8 l0 2.5 h-8 Z M223 142.5 h8 l.5 2.5 h-8 Z"/>
    <path d="M166 145 h8 l-1 2.5 h-8 Z M182 145 h8 l-.5 2.5 h-8 Z M198 145 h8 l0 2.5 h-8 Z M214 145 h8 l.5 2.5 h-8 Z M230 145 h8 l.5 2.5 h-8 Z"/>
  </g>
  <!-- tahtadaki taşlar: kale, şah, vezir -->
  <g fill="#07080d" stroke="#FFD58A" stroke-opacity=".85" stroke-width="1" stroke-linejoin="round">
    <path d="M187 142 h9 l-1.5-2 v-6 h1.6 v-3 h-1.6 v1.4 h-1.5 v-1.4 h-1.5 v1.4 h-1.5 v-1.4 h-1.6 v3 h1.6 v6 Z"/>
    <path d="M207 142 h9 l-1.6-2 v-9 h1.6 v-2.6 h-2 v-2 h-1.8 v2 h-2 v2.6 h1.6 v9 Z"/>
    <path d="M222 142 h9 l-1.5-2 v-7.5 l2.2-3.5 l-2.2 1.2 l-1.2-2.4 l-1.2 2.4 l-1.2-2.4 l-1.2 2.4 l-2.2-1.2 l2.2 3.5 v7.5 Z"/>
  </g>
  </g>
  <!-- LAMBA (karanlıkta da görünür) -->
  <line x1="200" y1="0" x2="200" y2="22" stroke="#E8B64C" stroke-opacity=".55" stroke-width="1.2"/>
  <path d="M186 22 H214 L224 38 H176 Z" fill="#0a0b10" stroke="#E8B64C" stroke-opacity=".75" stroke-width="1.2" stroke-linejoin="round"/>
</svg>
